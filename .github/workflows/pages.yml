name: Publish COOLPLAN website

# GitHub Pages is separate from the previously published ChatGPT Sites project.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Read GitHub Pages configuration
        id: pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm ci
      - name: Check procedural math and geometry
        run: npm test
      - name: Build complete website
        env:
          COOLPLAN_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: npm run build:site
      - name: Upload all six website routes
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published website and JavaScript
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node --input-type=module <<'JS'
          const page = new URL('website/', process.env.PAGE_URL);
          const response = await fetch(page);
          if (!response.ok) throw new Error(`Website returned HTTP ${response.status}`);
          const html = await response.text();
          if (!html.includes('id="floor-story"')) throw new Error('Published page is not the COOLPLAN scroll-motion website');
          const script = /<script[^>]+src="([^"]+)"/.exec(html)?.[1];
          if (!script) throw new Error('Website module is missing');
          const module = await fetch(new URL(script, page));
          if (!module.ok) throw new Error(`Website module returned HTTP ${module.status}`);
          console.log(`Verified published website: ${page}`);
          JS
